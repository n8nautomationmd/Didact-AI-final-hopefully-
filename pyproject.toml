[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "didactai"
version = "0.1.0"
description = "An adaptive mathematics tutor for Romanian students"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "openpyxl>=3.1.1",
    "scikit-learn>=1.3.2",
    "joblib>=1.3.2",
]

[project.optional-dependencies]
full = [
    "tensorflow-cpu>=2.16.1",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "wordcloud>=1.9",
    "xgboost>=2.0",
]
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.0.283",
    "black>=24.3.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"

[tool.streamlit]
client.showErrorDetails = true
client.toolbarMode = "viewer"
server.runOnSave = true
server.headless = true
server.maxUploadSize = 200
